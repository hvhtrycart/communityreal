<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Видео</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@300;400&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #080808;
    --card-bg: #111;
    --border: #222;
    --accent: #fff;
    --hover: rgba(255,255,255,0.06);
    --radius: 6px;
  }

  body {
    background: var(--bg);
    color: var(--accent);
    font-family: 'Montserrat', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ─── GALLERY ─────────────────────────────── */
  #gallery {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 48px 32px;
    gap: 24px;
  }

  .gallery-title {
    font-family: 'Montserrat', sans-serif;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.06em;
    color: #fff;
    opacity: 0.85;
    margin-bottom: 16px;
    text-align: center;
  }

  .grid-wrapper {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 24px;
    width: 100%;
    max-width: 1080px;
  }

  .row {
    display: flex;
    justify-content: center;
    gap: 24px;
    width: 100%;
  }

  .card {
    position: relative;
    flex: 0 0 calc(33.333% - 16px);
    aspect-ratio: 16 / 10;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    cursor: pointer;
    transition: border-color 0.25s, transform 0.25s, box-shadow 0.25s;
  }

  .row-bottom .card {
    flex: 0 0 calc(28% - 12px);
    aspect-ratio: 16 / 10;
  }

  .card:hover {
    border-color: rgba(255,255,255,0.35);
    transform: translateY(-4px) scale(1.015);
    box-shadow: 0 16px 48px rgba(0,0,0,0.7);
  }

  .card canvas,
  .card video.thumb {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  /* play overlay */
  .play-overlay {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(0,0,0,0.28);
    opacity: 0;
    transition: opacity 0.2s;
  }
  .card:hover .play-overlay { opacity: 1; }

  .play-icon {
    width: 52px;
    height: 52px;
    border: 2px solid rgba(255,255,255,0.85);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .play-icon::after {
    content: '';
    display: block;
    width: 0; height: 0;
    border-style: solid;
    border-width: 10px 0 10px 18px;
    border-color: transparent transparent transparent rgba(255,255,255,0.9);
    margin-left: 4px;
  }

  .card-num {
    position: absolute;
    bottom: 8px;
    left: 10px;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 13px;
    letter-spacing: 0.12em;
    color: rgba(255,255,255,0.55);
    pointer-events: none;
  }

  /* ─── PLAYER ─────────────────────────────── */
  #player {
    display: none;
    position: fixed;
    inset: 0;
    background: #000;
    z-index: 100;
    flex-direction: column;
  }
  #player.active { display: flex; }

  #player-video {
    width: 100%;
    height: 100%;
    object-fit: contain;
    background: #000;
  }

  #back-btn {
    position: fixed;
    top: 20px;
    right: 28px;
    z-index: 200;
    display: flex;
    align-items: center;
    gap: 8px;
    background: rgba(0,0,0,0.6);
    border: 1px solid rgba(255,255,255,0.18);
    border-radius: 32px;
    padding: 10px 20px 10px 14px;
    color: #fff;
    font-family: 'Montserrat', sans-serif;
    font-size: 13px;
    font-weight: 400;
    letter-spacing: 0.08em;
    cursor: pointer;
    backdrop-filter: blur(12px);
    transition: background 0.2s, border-color 0.2s;
    display: none;
  }
  #back-btn.active { display: flex; }
  #back-btn:hover {
    background: rgba(255,255,255,0.12);
    border-color: rgba(255,255,255,0.4);
  }
  #back-btn .arrow {
    font-size: 18px;
    line-height: 1;
    margin-top: -1px;
  }
</style>
</head>
<body>

<!-- GALLERY -->
<section id="gallery">
  <div class="gallery-title">communityreal</div>
  <div class="grid-wrapper">
    <div class="row row-top">
      <div class="card" data-src="1.mp4" data-idx="1"><canvas></canvas><div class="play-overlay"><div class="play-icon"></div></div><span class="card-num">01</span></div>
      <div class="card" data-src="2.mp4" data-idx="2"><canvas></canvas><div class="play-overlay"><div class="play-icon"></div></div><span class="card-num">02</span></div>
      <div class="card" data-src="3.mp4" data-idx="3"><canvas></canvas><div class="play-overlay"><div class="play-icon"></div></div><span class="card-num">03</span></div>
    </div>
    <div class="row row-bottom">
      <div class="card" data-src="4.mp4" data-idx="4"><canvas></canvas><div class="play-overlay"><div class="play-icon"></div></div><span class="card-num">04</span></div>
      <div class="card" data-src="5.mp4" data-idx="5"><canvas></canvas><div class="play-overlay"><div class="play-icon"></div></div><span class="card-num">05</span></div>
    </div>
  </div>
</section>

<!-- PLAYER -->
<div id="player">
  <video id="player-video" controls autoplay></video>
</div>

<!-- BACK BUTTON -->
<button id="back-btn">
  <span class="arrow">←</span>
  <span>Назад</span>
</button>

<script>
  const gallery    = document.getElementById('gallery');
  const player     = document.getElementById('player');
  const playerVideo= document.getElementById('player-video');
  const backBtn    = document.getElementById('back-btn');
  const cards      = document.querySelectorAll('.card');

  // ── Generate thumbnails from first frame ──────────────────
  cards.forEach(card => {
    const src    = card.dataset.src;
    const canvas = card.querySelector('canvas');
    const ctx    = canvas.getContext('2d');

    const tempVid = document.createElement('video');
    tempVid.src         = src;
    tempVid.muted       = true;
    tempVid.playsInline = true;
    tempVid.preload     = 'metadata';
    tempVid.crossOrigin = 'anonymous';

    tempVid.addEventListener('loadeddata', () => {
      tempVid.currentTime = 0.01;
    });

    tempVid.addEventListener('seeked', () => {
      canvas.width  = tempVid.videoWidth  || 640;
      canvas.height = tempVid.videoHeight || 360;
      ctx.drawImage(tempVid, 0, 0, canvas.width, canvas.height);
      tempVid.src = ''; // free memory
    });

    tempVid.load();
  });

  // ── Open player ──────────────────────────────────────────
  cards.forEach(card => {
    card.addEventListener('click', () => {
      const src = card.dataset.src;
      playerVideo.src = src;
      player.classList.add('active');
      backBtn.classList.add('active');
      gallery.style.display = 'none';
      playerVideo.play().catch(() => {});
    });
  });

  // ── Back button ──────────────────────────────────────────
  backBtn.addEventListener('click', () => {
    playerVideo.pause();
    playerVideo.src = '';
    player.classList.remove('active');
    backBtn.classList.remove('active');
    gallery.style.display = 'flex';
  });
</script>
</body>
</html>
